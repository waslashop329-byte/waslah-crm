name: Hourly ops-system sync

# Vercel Cron on the Hobby plan silently drops any cron job scheduled more
# often than once a day (confirmed live: only /api/cron/maintenance, the
# daily one, ever showed up in Vercel's own Cron Jobs list — the hourly
# /api/sync entry that used to be in vercel.json never actually ran, not
# even once, despite being correctly configured in code). GitHub Actions'
# own scheduler has no such restriction and is free for a public/private
# repo's own workflows, so this replaces Vercel Cron for this one job.
# Schedule paused: the real integration (main_system / "Waslah Ops System")
# was deactivated while stepping back to test against fake data instead —
# no active integration means this would just call /api/sync and get back
# "No matching active integration(s)" every hour, for nothing. Re-add the
# `schedule:` trigger once a real integration (e.g. Easy Order) is active
# again; `workflow_dispatch` is kept so it can still be run manually.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync
        run: |
          curl --fail-with-body -sS -X POST "https://waslah-crm.vercel.app/api/sync" \
            -H "Authorization: Bearer ${{ secrets.SYNC_API_SECRET }}"
